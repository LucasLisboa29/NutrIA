  - id: 10004
    nome: "Tomate, cereja, cru"
    categoria: "Verduras, hortaliças e derivados"
    origem: derivado
    base: "Tomate, com semente, cru"
    fator: 1.0  # mesma composição por 100 g; muda só o peso da unidade (porcoes.yaml)

  # ---------- Receitas da Base NutrIA ----------
  # Cada receita lista ingredientes da TACO (ou de itens acima) e o peso final do prato
  # pronto (rendimento_g). O código calcula o valor por 100 g sozinho: o número é
  # rastreável até a TACO, não é escrito "de cabeça" por ninguém.
  # Receitas caseiras típicas; podem ser ajustadas com a receita real de cada um.

  - id: 10005
    nome: "Molho branco (bechamel)"
    categoria: "Alimentos preparados"
    origem: receita
    rendimento_g: 520  # um pouco de água evapora no fogo
    ingredientes:
      - {alimento: "Leite, de vaca, integral", gramas: 500}
      - {alimento: "Manteiga, com sal", gramas: 30}
      - {alimento: "Farinha, de trigo", gramas: 30}

