# Medidas caseiras -> gramas (RF08, RF09).
#
# Os valores são referências aproximadas de tabelas de medidas caseiras brasileiras e
# vão ser calibrados nos testes (Fase 7). Editável com o servidor ligado (RF35).
#
# Como o código procura a medida de um item:
#   1. em `alimentos:`, a medida específica daquele alimento (1 concha de feijão);
#   2. em `medidas:`, a medida genérica (1 concha de qualquer coisa);
#   3. se a medida for desconhecida, usa a porção padrão do alimento e marca como estimado.
# Sem quantidade nenhuma ("comi arroz"), usa `padrao` do alimento (ou `padrao_geral`).

padrao_geral: 100  # gramas, para alimentos sem porção padrão própria

# Multiplicadores de tamanho: "concha grande", "prato cheio", "colher rasa".
tamanhos:
  pequeno: 0.7
  medio: 1.0
  grande: 1.4
  cheio: 1.3
  raso: 0.7
  generoso: 1.3
  meio: 0.5

# Outros nomes para a mesma medida (já no singular e sem acento).
apelidos_unidade:
  g: [grama, gr, gramas]
  kg: [quilo, kilo]
  ml: [mililitro]
  l: [litro]
  colher de sopa: [colher sopa, cs, colher grande, colherada]
  colher de cha: [colher cha, colher pequena, colherzinha, cc]
  colher de sobremesa: [colher sobremesa]
  colher de servir: [colher de arroz, colher servir]
  concha: [conchinha]
  escumadeira: []
  xicara: [xicara de cha, xicrinha]
  copo: [copo de requeijao, copo medio]
  copo americano: [copo pequeno, copinho]
  lata: [latinha]
  long neck: [longneck]
  garrafa: []
  fatia: [rodela, tira]
  pedaco: [pedacinho, naco, porcaozinha]
  unidade: [un, und, inteiro]
  prato: [prato raso]
  porcao: [porcao media]
  bife: [file]
  pote: [potinho]
  folha: []
  quadrado: [quadradinho]
  barra: [barrinha]
  sache: [saquinho, envelope]
  ponta de faca: []

# Medidas genéricas, em gramas (ou ml, considerando 1 ml ~ 1 g).
