# Sinônimos populares: como as pessoas falam -> nome exato do alimento na base.
#
# A TACO usa nomes técnicos ("Arroz, tipo 1, cozido"). Quem conversa diz "arroz".
# Aqui fica a escolha padrão para cada jeito comum de falar. Pode escrever com ou sem
# acento, no singular (o plural é tratado sozinho). O que não estiver aqui cai na busca
# aproximada.
#
# Editável com o servidor ligado: vale na próxima mensagem (RF35).

